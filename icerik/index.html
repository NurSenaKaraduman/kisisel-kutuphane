<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benim kütüphanem</title>

    <style>
        [hidden] { display: none !important; }
        body {
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #302936;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #963e65;
        }

        .tablo-alani {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #efdce4;
        }

        th {
            background: #f5dce7;
        }
        /* İlk sütun: kitap adları */
        tbody td:first-child {
            font-weight: 700;
            color: #783451;
        }

        /* İkinci sütun: yazarlar */
        tbody td:nth-child(2) {
            color: #625767;
        }

        /* Tablonun dış çerçevesi */
        .tablo-alani {
            border: 1px solid #efdce4;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(120, 52, 81, 0.08);
            overflow-x: auto;
        }

        /* Satırlar biraz daha ferah olsun */
        th, td {
            padding: 18px 20px;
            line-height: 1.5;
        }

        /* Fareyle üzerine geldiğin satırı belirginleştir */
        tbody tr:hover {
            background-color: #fff0f6;
        }

        /* Son satırın alt çizgisini kaldır */
        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Kitap sayısını küçük bir etiket gibi göster */
        #bilgi {
            display: inline-block;
            background: #f5dce7;
            color: #783451;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
        .filtreler {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 12px 0 24px;
        }

        .filtreler > div {
            flex: 1;
            min-width: 220px;
        }

        .filtreler label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .filtreler input,
        .filtreler select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9b8c8;
            border-radius: 10px;
            background: white;
            color: #302936;
            font: inherit;
        }

        .filtreler input:focus,
        .filtreler select:focus {
            outline: 2px solid #963e65;
            outline-offset: 2px;
        }
        .durum-secimi {
            padding: 9px;
            border: 1px solid #d9b8c8;
            border-radius: 8px;
            background: white;
            color: #302936;
            font: inherit;
        }

        .kaydet-dugmesi {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #963e65;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        .kaydet-dugmesi:hover {
            background: #783451;
        }

        .kaydet-dugmesi:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        .ekleme-formu {
            display: grid;
            gap: 10px;
            background: white;
            padding: 24px;
            margin: 16px 0 24px;
            border: 1px solid #efdce4;
            border-radius: 16px;
        }

        .ekleme-formu h2 {
            margin: 0 0 8px;
            color: #783451;
            font-size: 20px;
        }

        .ekleme-formu label {
            font-size: 14px;
            font-weight: 700;
        }

        .ekleme-formu input,
        .ekleme-formu select {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #d9b8c8;
            border-radius: 8px;
            font: inherit;
        }

        .ekleme-formu input:focus,
        .ekleme-formu select:focus {
            outline: 2px solid #963e65;
            outline-offset: 2px;
        }

        .ekleme-formu button {
            justify-self: start;
            margin-top: 8px;
        }

        #ekleme-mesaji {
            margin: 0;
            color: #783451;
        }
        .duzenle-dugmesi {
            margin: 6px;
            padding: 9px 14px;
            border: 1px solid #963e65;
            border-radius: 8px;
            background: white;
            color: #783451;
            font: inherit;
            cursor: pointer;
        }

        .duzenle-dugmesi:hover {
            background: #f5dce7;
        }

        .duzenle-dugmesi:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        .sil-dugmesi {
            margin: 6px;
            padding: 9px 14px;
            border: 1px solid #b4233b;
            border-radius: 8px;
            background: #fff1f2;
            color: #a01830;
            font: inherit;
            cursor: pointer;
        }

        .sil-dugmesi:hover {
            background: #ffe0e5;
        }

        .sil-dugmesi:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>

<body>
    <h1>Benim Kütüphanem</h1>
    <section id="giris-ekrani">
    <div id="rol-secimi" class="ekleme-formu">
        <h2>Kütüphaneme hoş geldin</h2>
        <p>Devam etmek için giriş türünü seç.</p>
        <div>
            <button id="yonetici-girisi" class="kaydet-dugmesi" type="button">Yönetici girişi</button>
            <button id="kullanici-girisi" class="duzenle-dugmesi" type="button">Kullanıcı girişi</button>
        </div>
    </div>
    <form id="giris-formu" class="ekleme-formu" hidden>
    <h2 id="giris-basligi">Kullanıcı girişi</h2>
    <label for="kullanici-email">E-posta</label>
    <input id="kullanici-email" type="email" autocomplete="email" required>

    <label for="yonetici-sifre">Şifre</label>
    <input
        id="yonetici-sifre"
        type="password"
        autocomplete="current-password"
        required
    >

    <div>
        <button id="kayit-dugmesi" type="button" class="duzenle-dugmesi">Kayıt ol</button>
        <button type="submit" class="kaydet-dugmesi">
            Giriş yap
        </button>

        <button type="button" id="geri-dugmesi" class="duzenle-dugmesi">Geri</button>
    </div>

    <p id="giris-mesaji" role="status">E-posta ve şifrenle giriş yap.</p>
</form>
    </section>
    <main id="kitaplik-ekrani" hidden>
    <div class="ekleme-formu">
        <p id="oturum-mesaji" role="status"></p>
        <button type="button" id="cikis-dugmesi" class="duzenle-dugmesi">Çıkış yap</button>
    </div>
    <p id="bilgi" role="status">Kitaplar yükleniyor...</p>
    
    <form id="kitap-formu" class="ekleme-formu" hidden>
    <h2>Yeni kitap ekle</h2>

    <label for="yeni-kitap-adi">Kitap adı</label>
    <input
        id="yeni-kitap-adi"
        type="text"
        maxlength="300"
        required
    >

    <label for="yeni-yazar">Yazar</label>
    <input
        id="yeni-yazar"
        type="text"
        maxlength="200"
        required
    >

    <label for="yeni-durum">Okuma durumu</label>
    <select id="yeni-durum">
        <option value="Okunmadı">Okunmadı</option>
        <option value="Okundu">Okundu</option>
        <option value="Okunuyor">Okunuyor</option>
        <option value="Yarıda bırakıldı">Yarıda bırakıldı</option>
    </select>

    <button
        id="kitap-ekle-dugmesi"
        type="submit"
        class="kaydet-dugmesi"
    >
        Kitabı ekle
    </button>

    <p id="ekleme-mesaji" role="status"></p>
</form>
        <div class="filtreler">
        <div>
        <label for="siralama">Kitap sıralaması</label>
        <select id="siralama">
            <option value="asc">Kitap adı: A → Z</option>
            <option value="desc">Kitap adı: Z → A</option>
        </select>
        </div>

        <div>
            <label for="arama">Kitap veya yazar ara</label>
            <input
                type="search"
                id="arama"
                placeholder="Örneğin: Camus"
            >
        </div>

        <div>
            <label for="durum-filtresi">Okuma durumu</label>
            <select id="durum-filtresi">
                <option value="">Tümü</option>
                <option value="Okundu">Okundu</option>
                <option value="Okunmadı">Okunmadı</option>
                <option value="Okunuyor">Okunuyor</option>
                <option value="Yarıda bırakıldı">Yarıda bırakıldı</option>
            </select>
        </div>
    </div>

    <div class="tablo-alani">
        <table>
            <thead>
                <tr>
                    <th>Kitap</th>
                    <th>Yazar</th>
                    <th>Durum</th>
                    <th>İşlem</th>
                </tr>
            </thead>

            <tbody id="kitap-listesi"></tbody>
        </table>
    </div>

    </main>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
        createUserWithEmailAndPassword, signOut } from
        "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBh_qNL1N1-_52gWKuBsxfMrR1UCscaQ40",
        authDomain: "sena-kutuphane.firebaseapp.com",
        projectId: "sena-kutuphane",
        storageBucket: "sena-kutuphane.firebasestorage.app",
        messagingSenderId: "695955033475",
        appId: "1:695955033475:web:30aeb945ec936253a63ab6"
    };
    const auth = getAuth(initializeApp(firebaseConfig));
    // Netlify ayrıysa buraya Render API adresini yaz (sonunda / olmadan).
    // For a separate Netlify frontend, enter the Render API URL here (no trailing /).
    const API_ADRESI = "";
    let secilenRol = sessionStorage.getItem("kutuphane-giris-rolu") || "kullanici";
    const girisEkrani = document.getElementById("giris-ekrani");
    const kitaplikEkrani = document.getElementById("kitaplik-ekrani");
    const girisFormu = document.getElementById("giris-formu");
    const rolSecimi = document.getElementById("rol-secimi");
    function rolSec(rol) {
        secilenRol = rol;
        sessionStorage.setItem("kutuphane-giris-rolu", rol);
        rolSecimi.hidden = true;
        girisFormu.hidden = false;
        document.getElementById("giris-basligi").textContent =
            rol === "yonetici" ? "Yönetici girişi" : "Kullanıcı girişi";
        document.getElementById("kayit-dugmesi").hidden = rol === "yonetici";
        girisMesaji.textContent = "E-posta ve şifrenle giriş yap.";
        document.getElementById("kullanici-email").focus();
    }
    document.getElementById("yonetici-girisi").addEventListener("click", () => rolSec("yonetici"));
    document.getElementById("kullanici-girisi").addEventListener("click", () => rolSec("kullanici"));
    document.getElementById("geri-dugmesi").addEventListener("click", () => {
        girisFormu.hidden = true;
        rolSecimi.hidden = false;
    });
    let yonetici = false;
    let oturumSurumu = 0;
    const girisMesaji = document.getElementById("giris-mesaji");
    const cikisDugmesi = document.getElementById("cikis-dugmesi");
    cikisDugmesi.hidden = true;

    function girisHatasi(hata) {
        const mesajlar = {
            "auth/invalid-credential": "E-posta veya şifre yanlış.",
            "auth/email-already-in-use": "Bu e-posta zaten kayıtlı. Giriş yapabilirsin.",
            "auth/weak-password": "Daha güçlü bir şifre seç (en az 6 karakter).",
            "auth/invalid-email": "Geçerli bir e-posta adresi yaz.",
            "auth/too-many-requests": "Çok fazla deneme yapıldı. Biraz sonra tekrar dene.",
            "auth/network-request-failed": "Bağlantı kurulamadı. İnternetini kontrol et."
        };
        return mesajlar[hata.code] || "İşlem tamamlanamadı. Lütfen tekrar dene.";
    }

    async function hesapIslemi(kayit) {
        const form = document.getElementById("giris-formu");
        if (!form.reportValidity()) return;
        const email = document.getElementById("kullanici-email").value.trim();
        const sifreAlani = document.getElementById("yonetici-sifre");
        const sifre = sifreAlani.value;
        const dugmeler = form.querySelectorAll("button");
        dugmeler.forEach(dugme => dugme.disabled = true);
        girisMesaji.textContent = "İşlem yapılıyor...";
        try {
            const islem = kayit ? createUserWithEmailAndPassword : signInWithEmailAndPassword;
            await islem(auth, email, sifre);
            sifreAlani.value = "";
        } catch (hata) {
            girisMesaji.textContent = girisHatasi(hata);
        } finally {
            dugmeler.forEach(dugme => dugme.disabled = false);
        }
    }
    document.getElementById("giris-formu").addEventListener("submit", olay => {
        olay.preventDefault();
        hesapIslemi(false);
    });
    document.getElementById("kayit-dugmesi").addEventListener("click", () => hesapIslemi(true));
    cikisDugmesi.addEventListener("click", async () => {
        try { await signOut(auth); }
        catch (hata) { girisMesaji.textContent = girisHatasi(hata); }
    });

    async function yoneticiIstegi(adres, ayarlar = {}) {
        if (!auth.currentUser || !yonetici) {
            throw new Error("Bu işlem için yönetici hesabıyla giriş yapmalısın.");
        }
        const basliklar = new Headers(ayarlar.headers);
        // Şifre yerine Firebase'in yenilenebilir kimlik tokenını gönder.
        // Send Firebase's refreshable ID token instead of a password.
        basliklar.set("Authorization", `Bearer ${await auth.currentUser.getIdToken()}`);
        const cevap = await fetch(API_ADRESI + adres, {...ayarlar, headers: basliklar});
        if (cevap.status === 401 || cevap.status === 403) {
            yonetici = false;
            document.getElementById("kitap-formu").hidden = true;
            kitaplariGoster();
            throw new Error("Oturum veya yönetici yetkisi doğrulanamadı. Yeniden giriş yap.");
        }
        return cevap;
    }

    let tumKitaplar = [];

    const bilgi = document.getElementById("bilgi");
    const liste = document.getElementById("kitap-listesi");
    const arama = document.getElementById("arama");
    const durumFiltresi = document.getElementById("durum-filtresi");
    const siralama = document.getElementById("siralama");

    function kitaplariGoster() {
        const aranan = arama.value.trim().toLocaleLowerCase("tr");
        const secilenDurum = durumFiltresi.value;

        const sonuc = tumKitaplar.filter(function (kitap) {
            const metin = (kitap.kitap_adi + " " + kitap.yazar)
                .toLocaleLowerCase("tr");

            const aramaUyuyor = metin.includes(aranan);

            const durumUyuyor =
                secilenDurum === "" || kitap.durum === secilenDurum;

            return aramaUyuyor && durumUyuyor;
        });

        sonuc.sort(function (a, b) {
            const karsilastirma = a.kitap_adi.localeCompare(
                b.kitap_adi,
                "tr",
                { sensitivity: "base", numeric: true }
            );

            if (siralama.value === "desc") {
                return -karsilastirma;
            }

            return karsilastirma;
        });

        liste.replaceChildren();

                for (const kitap of sonuc) {
            const satir = document.createElement("tr");

            // Kitap adı ve yazar hücreleri
            for (const alan of ["kitap_adi", "yazar"]) {
                const hucre = document.createElement("td");
                hucre.textContent = kitap[alan];
                satir.appendChild(hucre);
            }

            if (!yonetici) {
                const durum = document.createElement("td");
                durum.textContent = kitap.durum;
                satir.appendChild(durum);
                const islem = document.createElement("td");
                islem.textContent = "—";
                satir.appendChild(islem);
                liste.appendChild(satir);
                continue;
            }

            // Durum seçimi
            const durumHucresi = document.createElement("td");
            const secim = document.createElement("select");
            secim.className = "durum-secimi";
            secim.setAttribute(
                "aria-label",
                `${kitap.kitap_adi} için okuma durumu`
            );

            for (const durum of [
                "Okundu",
                "Okunmadı",
                "Okunuyor",
                "Yarıda bırakıldı"
            ]) {
                const secenek = document.createElement("option");
                secenek.value = durum;
                secenek.textContent = durum;
                secim.appendChild(secenek);
            }

            secim.value = kitap.durum;
            durumHucresi.appendChild(secim);
            satir.appendChild(durumHucresi);

            // Kaydet düğmesi
            const islemHucresi = document.createElement("td");
            const dugme = document.createElement("button");
            dugme.type = "button";
            dugme.className = "kaydet-dugmesi";
            dugme.textContent = "Kaydet";

            dugme.addEventListener("click", async function () {
                const yeniDurum = secim.value;

                dugme.disabled = true;
                secim.disabled = true;
                dugme.textContent = "Kaydediliyor...";

                try {
                    const cevap = await yoneticiIstegi(
                        `/kitaplar/${kitap.id}/durum`,
                        {
                            method: "PATCH",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                durum: yeniDurum
                            })
                        }
                    );

                    if (!cevap.ok) {
                        throw new Error(
                            `Kayıt başarısız. HTTP: ${cevap.status}`
                        );
                    }

                    const kayit = await cevap.json();

                    kitap.durum = kayit.durum;
                    kitaplariGoster();

                    bilgi.textContent +=
                        ` — ${kitap.kitap_adi}: durum kaydedildi.`;
                } catch (hata) {
                    bilgi.textContent =
                        "Kayıt doğrulanamadı. Sayfayı yenileyip durumu kontrol et.";
                    console.error(hata);
                } finally {
                    dugme.disabled = false;
                    secim.disabled = false;
                    dugme.textContent = "Kaydet";
                }
            });

            islemHucresi.appendChild(dugme);
                        const duzenleDugmesi = document.createElement("button");
            duzenleDugmesi.type = "button";
            duzenleDugmesi.className = "duzenle-dugmesi";
            duzenleDugmesi.textContent = "Düzenle";

            duzenleDugmesi.addEventListener("click", async function () {
                const yeniAd = prompt("Kitap adı:", kitap.kitap_adi);

                if (yeniAd === null) {
                    return;
                }

                const yeniYazar = prompt("Yazar:", kitap.yazar);

                if (yeniYazar === null) {
                    return;
                }

                if (!yeniAd.trim() || !yeniYazar.trim()) {
                    bilgi.textContent =
                        "Kitap adı ve yazar boş bırakılamaz.";
                    return;
                }

                if (yeniAd.trim().length > 300 ||
                    yeniYazar.trim().length > 200) {
                    bilgi.textContent =
                        "Kitap adı en fazla 300, yazar 200 karakter olabilir.";
                    return;
                }

                duzenleDugmesi.disabled = true;
                duzenleDugmesi.textContent = "Kaydediliyor...";

                try {
                    const cevap = await yoneticiIstegi(`/kitaplar/${kitap.id}`, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            kitap_adi: yeniAd.trim(),
                            yazar: yeniYazar.trim()
                        })
                    });

                    if (!cevap.ok) {
                        if (cevap.status === 409) {
                            throw new Error(
                                "Bu kitap adı ve yazar zaten kayıtlı."
                            );
                        }

                        throw new Error(
                            `Düzenleme başarısız. HTTP: ${cevap.status}`
                        );
                    }

                    const guncellenen = await cevap.json();

                    kitap.kitap_adi = guncellenen.kitap_adi;
                    kitap.yazar = guncellenen.yazar;

                    kitaplariGoster();
                    bilgi.textContent += " — Kitap bilgileri güncellendi.";
                } catch (hata) {
                    bilgi.textContent =
                        hata.message +
                        " Gerekirse sayfayı yenileyip kaydı kontrol et.";
                } finally {
                    duzenleDugmesi.disabled = false;
                    duzenleDugmesi.textContent = "Düzenle";
                }
            });

            islemHucresi.appendChild(duzenleDugmesi);
                        const silDugmesi = document.createElement("button");
            silDugmesi.type = "button";
            silDugmesi.className = "sil-dugmesi";
            silDugmesi.textContent = "Sil";

            silDugmesi.addEventListener("click", async function () {
                const onay = confirm(
                    `"${kitap.kitap_adi}" — ${kitap.yazar}\n` +
                    `Kayıt ID: ${kitap.id}\n\n` +
                    "Bu kaydı silmek istediğine emin misin?"
                );

                if (!onay) {
                    return;
                }

                silDugmesi.disabled = true;
                silDugmesi.textContent = "Siliniyor...";

                try {
                    const cevap = await yoneticiIstegi(`/kitaplar/${kitap.id}`, {
                        method: "DELETE"
                    });

                    if (!cevap.ok) {
                        throw new Error(
                            `Silme başarısız. HTTP: ${cevap.status}`
                        );
                    }

                    tumKitaplar = tumKitaplar.filter(function (kayit) {
                        return kayit.id !== kitap.id;
                    });

                    kitaplariGoster();
                    bilgi.textContent +=
                        ` — ${kitap.kitap_adi} silindi.`;
                } catch (hata) {
                    bilgi.textContent =
                        hata.message +
                        " Sayfayı yenileyip kaydın durumunu kontrol et.";
                } finally {
                    silDugmesi.disabled = false;
                    silDugmesi.textContent = "Sil";
                }
            });

            islemHucresi.appendChild(silDugmesi);
            satir.appendChild(islemHucresi);
            liste.appendChild(satir);
        }

        bilgi.textContent = sonuc.length === 0
            ? "Aramana uygun kitap bulunamadı."
            : `${tumKitaplar.length} kayıttan ${sonuc.length} tanesi gösteriliyor`;
    }

    async function kitaplariYukle() {
        arama.disabled = true;
        durumFiltresi.disabled = true;

        try {
            const cevap = await fetch(API_ADRESI + "/kitaplar");

            if (!cevap.ok) {
                throw new Error("Kitaplar alınamadı.");
            }

            tumKitaplar = await cevap.json();
            kitaplariGoster();

            arama.disabled = false;
            durumFiltresi.disabled = false;
        } catch (hata) {
            bilgi.textContent =
                "Kitaplar yüklenemedi. API'yi kontrol edip sayfayı yenile.";
            console.error(hata);
        }
    }

    arama.addEventListener("input", kitaplariGoster);
    durumFiltresi.addEventListener("change", kitaplariGoster);
    siralama.addEventListener("change", kitaplariGoster);

    const kitapFormu = document.getElementById("kitap-formu");

    kitapFormu.addEventListener("submit", async function (olay) {
        olay.preventDefault();

        const adAlani = document.getElementById("yeni-kitap-adi");
        const yazarAlani = document.getElementById("yeni-yazar");
        const durumAlani = document.getElementById("yeni-durum");
        const mesaj = document.getElementById("ekleme-mesaji");
        const dugme = document.getElementById("kitap-ekle-dugmesi");

        const yeniKitap = {
            kitap_adi: adAlani.value.trim(),
            yazar: yazarAlani.value.trim(),
            durum: durumAlani.value
        };

        if (!yeniKitap.kitap_adi || !yeniKitap.yazar) {
            mesaj.textContent = "Kitap adı ve yazar boş bırakılamaz.";
            return;
        }

        dugme.disabled = true;
        mesaj.textContent = "Kaydediliyor...";

        try {
            const cevap = await yoneticiIstegi("/kitaplar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(yeniKitap)
            });

            if (!cevap.ok) {
                if (cevap.status === 409) {
                    throw new Error("Bu kitap adı ve yazar zaten kayıtlı.");
                }

                throw new Error(
                    `Kitap eklenemedi. HTTP: ${cevap.status}`
                );
            }

            const kaydedilenKitap = await cevap.json();

            kitapFormu.reset();

            // Yeni kitabın filtre yüzünden gizlenmesini önle.
            arama.value = "";
            durumFiltresi.value = "";

            await kitaplariYukle();

            mesaj.textContent =
                `${kaydedilenKitap.kitap_adi} veritabanına eklendi.`;
        } catch (hata) {
            mesaj.textContent =
                hata.message +
                " Tekrar denemeden önce gerekirse sayfayı yenileyip kontrol et.";
        } finally {
            dugme.disabled = false;
        }
    });
    onAuthStateChanged(auth, async kullanici => {
        const surum = ++oturumSurumu;
        yonetici = false;
        kitapFormu.hidden = true;
        kitaplikEkrani.hidden = true;
        girisEkrani.hidden = false;
        cikisDugmesi.hidden = !kullanici;
        kitaplariGoster();
        if (!kullanici) {
            rolSecimi.hidden = false;
            girisFormu.hidden = true;
            tumKitaplar = [];
            liste.replaceChildren();
            girisMesaji.textContent = "Giriş yapılmadı.";
            return;
        }
        girisMesaji.textContent = "Hesap yetkileri kontrol ediliyor...";
        try {
            const cevap = await fetch(API_ADRESI + "/oturum", {
                headers: {Authorization: `Bearer ${await kullanici.getIdToken()}`}
            });
            if (!cevap.ok) throw new Error("Yetkiler doğrulanamadı. API bağlantısını kontrol et.");
            const oturum = await cevap.json();
            if (surum !== oturumSurumu) return;
            if (secilenRol === "yonetici" && oturum.yonetici !== true) {
                await signOut(auth);
                rolSec("yonetici");
                girisMesaji.textContent = "Bu hesabın yönetici yetkisi yok. Kullanıcı girişini seçebilirsin.";
                return;
            }
            // Giriş türü yetki vermez; yönetici yetkisini sunucu doğrular.
            // The selected login type grants no permissions; the server verifies admin access.
            yonetici = secilenRol === "yonetici" && oturum.yonetici === true;
            kitapFormu.hidden = !yonetici;
            girisMesaji.textContent = yonetici
                ? "Yönetici girişi başarılı. Kitapları değiştirebilirsin."
                : "Kullanıcı girişi başarılı. Kitapları gezebilirsin.";
            document.getElementById("oturum-mesaji").textContent = girisMesaji.textContent;
            girisEkrani.hidden = true;
            kitaplikEkrani.hidden = false;
            await kitaplariYukle();
        } catch (hata) {
            if (surum === oturumSurumu) girisMesaji.textContent = hata.message;
        }
    });
</script>
</body>
</html>
